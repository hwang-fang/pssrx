# ゴールデンテストの入力パラメータと正解の集計。
#
# 解析ループ（pipeline.RunInterrogator）に渡す値そのものを固定してある。設定
# ファイルの書式や緯度経度からの幾何計算は通さないので、それらを変えてもここは
# 変えない。変えてよいのは解析本体の仕様を意図して変えるときだけで、その際は
# cmd/intgdiff で旧ゴールデンとの差分を確かめて記録する。
#
# 出どころ: 2026-09-12 に固定した既知の正しい出力。このディレクトリの intg が
# 唯一の正解になる。解析パラメータは qpkx の実データから推定した暫定値で、
# 実際の局の値ではない（README「検証」を参照）。
params:
  around_time_ns: 4040000000   # 走査周期 4.04 s（秒からは切り捨て）
  pattern: AC                  # 質問種別列。stagger_ns と組で 1 周期（設定の mode_pattern に相当）
  stagger_ns: [2949900]        # 質問間隔列 [ns]（設定の interval_pattern_ns に相当）
  clockwise: true
  # SSR (34.85058333, 136.82093888, 標高 0 m) を原点にした
  # 測定局 (34.8583717981495, 136.810685698149, 標高 0 m) の ENU 斜距離と
  # 真北基準の方位。ビット単位で固定するため 16 進浮動小数で書く。
  st_dist_hex: "0x1.3ec373e829ec3p+10"    # 1275.0539493951226 m
  st_azimuth_hex: "0x1.5d3f8cad53ae9p+2"  # 5.4570037548680626 rad

# PSSR（応答信号による位置推定）のゴールデン。rounding ケースに apkx を
# 添えてあり、intg + apkx から出した位置を fixes.csv に固定する。
#
# 出どころ: 2026-09-13 時点の実装の出力を固定した。
# 段 2〜5（対応づけ・復号・幽霊抑圧・位置推定・CSV）の回帰を検出する
# ためのもので、仕様を意図して変えるときだけ更新する（golden_test.go の
# -update-pssr-golden）。更新時は差分を確かめて記録する。
#
# 窓と幾何は testdata/kx90.yaml から pipeline.PSSRParams が導いた値を
# リテラルで固定してある。
pssr:
  station: KX90
  tau_min_ns: 7254        # 3 µs + 基線長 1275.05 m / c
  tau_max_ns: 2675766     # 3 µs + (2 × 400 km + 基線長) / c。PRI 2949900 ns より短い
  max_range_m: 400000
  ssr: {lat: 34.85058333, lon: 136.82093888, alt: 0}
  station_pos: {lat: 34.8583717981495, lon: 136.810685698149, alt: 0}

# 各ケースの期間（JST）と正解の集計。バイト比較だけだと、出力が空で
# ファイルも空という状態を見逃しうるので件数も添える。
cases:
  sorting:
    from: 2026-06-10T00:47
    to: 2026-06-10T00:50
    guards: 読み込み時の安定ソート（入力に時刻の逆行を含む）
    blocks: 3
    records: 58918
  rounding:
    from: 2026-06-10T00:00
    to: 2026-06-10T00:03
    guards: ブラケット内挿の偶数丸め（丸めが 0.5 ちょうどに当たる質問を含む）
    blocks: 3
    records: 60210
