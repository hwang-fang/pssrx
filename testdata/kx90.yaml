# KX90 の検証用設定。
#
# 注意: これは実際の局情報ではない。Q6 で提供予定の局パラメータが届くまでの
# 暫定値で、PRI と質問種別は qpkx の実データから推定し（PRI 中央値
# 2949900 ns、モードは 3/5 交互）、走査周期はドウェル間隔の中央値
# 4.0398 s から 4.04 s とした。位置は centrair の緯度経度（標高 0）を
# そのまま流用している。
#
# 位置が実物と違っても Python 実装との突き合わせには影響しない。
# 距離と方位はタイムスタンプの一定オフセットと方位の定数回転にしか効かず、
# ドウェル検出そのものには関与しないため、両実装が同じ値を使えば
# バイト一致の検証は成立する。
#
# ssrs / stations は ID をキーにしたマスタ。どの局とどの SSR を組み合わせて
# 処理するかはここでは決めず、コマンドの -station / -ssr で指定する。
ssrs:
  KX90S:
    name: KX90_SSR
    lat: 34.85058333
    lon: 136.82093888
    alt: 0
    max_range_m: 400000      # 暫定。SSR の覆域（応答の対応づけの遅延上限に使う）
    interrogation:
      around_time_sec: 4.04
      mode_pattern: AC                 # 質問種別の繰り返し
      interval_pattern_ns: [2949900]   # 質問間隔 [ns] の繰り返し。一定なら 1 要素
      clockwise: true
stations:
  KX90:
    name: KX90_STATION
    lat: 34.8583717981495
    lon: 136.810685698149
    alt: 0
