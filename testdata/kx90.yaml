# KX90 の検証用設定。
#
# 注意: これは実際の局情報ではない。Q6 で提供予定の局パラメータが届くまでの
# 暫定値で、PRI と質問種別は qpkx の実データから推定し（PRI 中央値
# 2949900 ns、モードは 3/5 交互）、走査周期はドウェル間隔の中央値
# 4.0398 s から 4.04 s とした。座標は centrair の投影済み値をそのまま
# 流用している。
#
# 座標が実物と違っても Python 実装との突き合わせには影響しない。
# 距離と方位はタイムスタンプの一定オフセットと方位の定数回転にしか効かず、
# ドウェル検出そのものには関与しないため、両実装が同じ値を使えば
# バイト一致の検証は成立する。
#
# ssrs / stations は ID をキーにしたマスタ。どの局とどの SSR を組み合わせて
# 処理するかはここでは決めず、コマンドの -station / -ssr で指定する。
ssrs:
  KX90S:
    name: KX90_SSR
    icao: KX9
    serial_no: 1
    x: -127458.67663663127
    y: -31615.025566053235
    interrogation:
      around_time_sec: 4.04
      pattern: AC
      quest_cycle_100ns: 29499
      stagger: 0
      clockwise: true
stations:
  KX90:
    name: KX90_STATION
    icao: KX9
    serial_no: 1
    x: -126591.43986481673
    y: -32549.562701800554
